# Compila un APK de Android para pruebas, sin cuenta de Expo.
# Se lanza a mano desde GitHub: pestaña Actions → "APK de prueba (Android)" → Run workflow.
# Al terminar, el APK queda en la sección "Artifacts" de la ejecución.
name: APK de prueba (Android)
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # APK para probadores: todos los niveles abiertos y sin muro de padres. No usar para la tienda.
      EXPO_PUBLIC_TESTERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kids-all-star-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
